pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id("io.micronaut.build.shared.settings") version "8.1.4"
}

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

// Micronaut core 5.3.0-SNAPSHOT, which carries the development-mode API, comes from Maven local, where a
// core checkout publishes it with publishToMavenLocal (pass -Dmaven.repo.local to use a private repository),
// or from the Central snapshots repository. Only io.micronaut snapshots are resolved from them. Projects
// declare their own repositories, which replace the settings ones, so they are added to each project too, with
// Maven Central, which the settings ones would have brought.
// Remove once the build moves to a core release.
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    repositories.mavenLocal {
        content {
            includeVersionByRegex("io\\.micronaut", ".*", ".*-SNAPSHOT")
        }
    }
    repositories.maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex("io\\.micronaut(\\..*)?")
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject {
    micronautSnapshotRepositories(it.repositories)
    it.repositories.mavenCentral()
}

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-kotlin")
    importMicronautCatalog("micronaut-security")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-reactor")
}

rootProject.name = 'graphql-parent'

include "graphql"
include "graphql-bom"

include 'docs-examples:hello-world-java'
include 'docs-examples:hello-world-groovy'
include 'docs-examples:hello-world-kotlin'
include 'docs-examples:hello-world-python'

[
        "chat",
        "jwt-security",
        "todo-java-tools",
        "todo-spqr"
].each { name ->
    include name
    def project = findProject(":${name}")
    project.name = "micronaut-graphql-example-${name}"
    project.projectDir = new File(settingsDir, "examples/${name}")
}

include 'test-suite-graal'
include 'test-suite-serde'
include 'test-suite-jackson'
